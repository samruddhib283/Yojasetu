<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trending Government Schemes - Video Guides</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f1f8ff;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }
    .card {
      margin-bottom: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      border-radius: 15px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }
    .scheme-info h5 {
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4 text-primary">🎥 Trending Government Scheme Video Guides</h2>

    <input type="text" id="searchInput" class="form-control mb-4" placeholder="Search scheme name..." onkeyup="filterSchemes()">

    <div id="videoList">
      {% for scheme in schemes %}
        <div class="card p-3 scheme-card">
          <div class="row g-4 align-items-center">
            <!-- Left: Scheme Info -->
            <div class="col-md-6 scheme-info">
              <h5>{{ scheme.name }}</h5>
              <p class="text-muted">{{ scheme.description }}</p>
            </div>

            <!-- Right: Video -->
            <div class="col-md-6">
              <div class="ratio ratio-16x9">
                <iframe src="https://www.youtube.com/embed/{{ scheme.youtube_id }}" allowfullscreen></iframe>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <script>
    function filterSchemes() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.getElementsByClassName("scheme-card");
      Array.from(cards).forEach(card => {
        const name = card.querySelector("h5").innerText.toLowerCase();
        card.style.display = name.includes(input) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
